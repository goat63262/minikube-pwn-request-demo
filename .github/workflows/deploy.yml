name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
